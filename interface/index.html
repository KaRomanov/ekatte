<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <title>Ekatte</title>
    <script type="module" src="script.js" defer></script>
</head>

<body>

    <div id="form-body">
        <form id="search-form">

            <label>
                Име на населено място:
                <input type="text" name="town" id="town">
            </label>

            <label>
                Кметство:
                <input type="text" name="townhall" id="townhall">
            </label>

            <label>
                Община:
                <input type="text" name="municipality" id="municipality">
            </label>

            <label>
                Област:
                <input type="text" name="region" id="region">
            </label>

            <div class="button-row">
                <button type="submit">Търси</button>
                <button type="reset">Нулирай търсенето</button>
            </div>
        </form>
    </div>


    <div id="stats-body">
        <div class="stat-item">Брой редове: <span id="rows-count">0</span></div>
        <div class="stat-item">Брой селища: <span id="towns-count">0</span></div>
        <div class="stat-item">Брой кметства: <span id="townhalls-count">0</span></div>
        <div class="stat-item">Брой общини: <span id="municipalities-count">0</span></div>
        <div class="stat-item">Брой региони: <span id="regions-count">0</span></div>

        <div class="stat-reports">
            <button id="export-csv">Export CSV</button>
            <button id="export-excel">Export Excel</button>
        </div>
    </div>


    <div id="table-body">
        <div id="table-error"></div>
        <table id="table">
            <thead>
                <tr>
                    <th data-key="id">ID (ekatte)</th>
                    <th data-key="town">Селище</th>
                    <th data-key="townhall">Кметство</th>
                    <th data-key="municipality">Община</th>
                    <th data-key="municipality_id">Код на общината</th>
                    <th data-key="region">Област</th>
                </tr>
            </thead>
            <tbody id="table-tbody">

            </tbody>
        </table>
    </div>
    <div class="pagination">
        <button class="backward" id="first">First</button>
        <div class="page-numbers" id="pageNumbers"></div>
        <button class="forward" id="last">Last</button>
    </div>

</body>

</html>
